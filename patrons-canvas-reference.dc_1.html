<style>
body{margin:0;background:#070b12}
.tp-card{transition:border-color 160ms ease-out}
.tp-card:hover,.tp-card:focus-visible{border-color:#c9a85c !important}
.tp-card:focus-visible{outline:2px solid #e8cf8f;outline-offset:3px}
.tp-name{transition:color 160ms ease-out}
.tp-card:hover .tp-name,.tp-card:focus-visible .tp-name{color:#e8cf8f !important}
.tp-emblem{transition:transform 320ms cubic-bezier(0.16,1,0.3,1)}
.tp-card:hover .tp-emblem,.tp-card:focus-visible .tp-emblem{transform:scale(1.07)}
.tp-nav a{transition:color 120ms ease-out}
.tp-nav a:hover{color:#ece4d2 !important}
.tp-tab{transition:color 120ms ease-out,background-color 120ms ease-out}
.tp-tab:hover{color:#ece4d2 !important}
.tp-nav a:focus-visible,.tp-tab:focus-visible,.tp-reset:focus-visible,.tp-brand:focus-visible{outline:2px solid #e8cf8f;outline-offset:-2px}
.tp-search:focus-within{border-color:#c9a85c !important}
.tp-search input::placeholder{color:#8f8a7c;opacity:1}
.tp-search input::-webkit-search-cancel-button{display:none}
.tp-reset:hover{background:#c9a85c !important;color:#070b12 !important}
@media (max-width:48em){
.tp-head{flex-wrap:wrap !important;height:auto !important;padding:0 16px !important;gap:0 !important}
.tp-brand{height:52px}
.tp-nav{order:3;flex:0 0 100% !important;overflow-x:auto;border-top:1px solid #1a2230}
.tp-nav a{height:44px !important;padding:0 10px !important}
.tp-main{padding:32px 16px 64px !important}
.tp-title{font-size:44px !important}
.tp-bar{padding:12px !important}
.tp-search{flex:1 1 100% !important}
.tp-tabs{overflow-x:auto;flex-wrap:nowrap !important;width:100%}
.tp-status{margin-left:0 !important}
.tp-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important;gap:12px !important}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</helmet>

<a href="#season-2" style="display: flex; align-items: center; height: 60px; padding: 0 14px; border-bottom: 2px solid transparent; color: #a7a295; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none; white-space: nowrap;">Season 2</a>

<main class="tp-main" style="max-width: 1360px; margin: 0 auto; padding: 56px 32px 96px; box-sizing: border-box;">
<header style="display: flex; flex-direction: column; align-items: center; text-align: center;">
<p style="margin: 0; color: #c9a85c; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase;">Truce · Seasons 1 to 3</p>
<h1 class="tp-title" style="margin: 12px 0 0; color: #ece4d2; font-family: Cinzel, 'Source Serif 4', Georgia, serif; font-size: 72px; font-weight: 700; line-height: 1.05; letter-spacing: 0.06em; text-transform: uppercase;">Patrons</h1>

<p style="max-width: 60ch; margin: 18px 0 0; color: #9a9586; font-size: 16px;">Every patron a Herald has played, A to Z. Open one to read its abilities.</p>

</header>
<div class="tp-bar" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 40px; padding: 10px 16px; background: #0b121d; border-top: 1px solid #6f5a32; border-bottom: 1px solid #6f5a32;">
<label class="tp-search" style="display: flex; flex: 0 1 320px; align-items: center; gap: 8px; height: 40px; padding: 0 12px; background: #070b12; border: 1px solid #2c384b; color: #ece4d2; cursor: text;">

</label>
<div class="tp-tabs" role="group" aria-label="Show patrons from" style="display: flex; flex-wrap: wrap; align-items: stretch;">

<span>{{t.label}}</span>

</button>
</sc-for>
</div>
<p class="tp-status" role="status" style="margin: 0 0 0 auto; color: #9a9586; font-size: 13px; font-variant-numeric: tabular-nums;">{{status}}</p>
</div>
<sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">

<span aria-hidden="true" style="position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: #0c1420; border-bottom: 1px solid #2c384b;">
<span class="tp-emblem" style="position: absolute; inset: 0; display: grid; place-items: center;">
<span style="position: absolute; width: 64%; aspect-ratio: 1; border: 1px solid {{p.tint}}; opacity: 0.3; transform: rotate(45deg);"></span>
<span style="position: absolute; width: 46%; aspect-ratio: 1; border: 1px solid {{p.tint}}; opacity: 0.6; transform: rotate(45deg);"></span>
<span style="position: relative; color: {{p.tint}}; font-family: Cinzel, 'Source Serif 4', Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: 0.04em;">{{p.initials}}</span>
</span>
<span style="position: absolute; top: 8px; left: 8px; display: flex; align-items: center; gap: 6px; padding: 4px 7px; background: #070b12; border: 1px solid #2c384b; color: #c8c2b3; font-size: 11px; font-weight: 600; line-height: 1; letter-spacing: 0.1em;">
<span style="width: 6px; height: 6px; background: {{p.tint}}; transform: rotate(45deg);"></span>{{p.short}}
</span>
</span>
<span style="display: block; padding: 12px 12px 14px;">
<span class="tp-name" style="display: block; color: #ece4d2; font-family: Cinzel, 'Source Serif 4', Georgia, serif; font-size: 15px; font-weight: 700; line-height: 1.2; letter-spacing: 0.06em; text-transform: uppercase; overflow-wrap: anywhere;">{{p.name}}</span>
<span style="display: block; margin-top: 4px; color: #958f80; font-size: 11.5px; font-weight: 600; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase;">{{p.origin}}</span>
</span>
</a>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 28px; padding: 32px; border: 1px dashed #6f5a32; color: #9a9586; text-align: center;">
<p style="margin: 0; color: #ece4d2; font-weight: 600;">{{emptyLine}}</p>
<button type="button" class="tp-reset" onClick="{{reset}}" style="margin-top: 14px; height: 40px; padding: 0 18px; border: 1px solid #c9a85c; background: transparent; color: #e8cf8f; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Show every patron</button>
</div>
</sc-if>
</main>
</div>
