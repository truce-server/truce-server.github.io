name: Build and Deploy React App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Copy chat folders into public
        run: |
          # Each season keeps its own folder, which is where the app loads chats from.
          if [ -d "SeasonOneChat" ]; then
            mkdir -p public/SeasonOneChat
            cp -r SeasonOneChat/. public/SeasonOneChat/
          fi

          if [ -d "SeasonTwoChat" ]; then
            mkdir -p public/SeasonTwoChat
            cp -r SeasonTwoChat/. public/SeasonTwoChat/
          fi

          if [ -d "NEEDIMPLEMENT" ]; then
            mkdir -p public/NEEDIMPLEMENT
            cp -r NEEDIMPLEMENT/. public/NEEDIMPLEMENT/
          fi

          # Original banner and logo images
          if [ -d "Assets" ]; then
            cp Assets/*.png public/ 2>/dev/null || true
          fi

      # `npm run build` first regenerates the chat lists and chat-meta.json from public/
      # (scripts/build-index.mjs), then copies index.html to 404.html so shared links load directly.
      - name: Build React app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
