name: Build and Deploy React App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Copy chatlog folders to public
        run: |
          mkdir -p public

          # Season 1 — copy flat into public/
          if [ -d "SeasonOneChat" ]; then
            cp -r SeasonOneChat/* public/
          fi

          # Season 2 — keep under public/SeasonTwoChat/ so paths stay scoped
          if [ -d "SeasonTwoChat" ]; then
            mkdir -p public/SeasonTwoChat
            cp -r SeasonTwoChat/* public/SeasonTwoChat/
          fi

          if [ -d "NEEDIMPLEMENT" ]; then
            cp -r NEEDIMPLEMENT public/
          fi

          # Assets (logo images)
          if [ -d "Assets" ]; then
            cp Assets/*.png public/ 2>/dev/null || true
          fi

      - name: Generate sitemaps
        run: |
          python3 - << 'PY'
          import os, json

          public_dir = "public"
          # Folders to exclude from Season 1 sitemap
          s1_ignore = {
            ".git", ".github", "workflows", "assets", "css", "js",
            "node_modules", "src", "build", "NEEDIMPLEMENT", "SeasonTwoChat"
          }

          # ── Season 1 sitemap (sitemap.json) ──────────────────────────────
          s1_folders = [
            d for d in os.listdir(public_dir)
            if os.path.isdir(os.path.join(public_dir, d))
            and not d.startswith(".")
            and d not in s1_ignore
          ]
          s1_folders.sort(key=str.lower)

          s1_site = {}
          for d in s1_folders:
            folder_path = os.path.join(public_dir, d)
            files = [f for f in os.listdir(folder_path) if f.lower().endswith(".html")]
            files.sort(key=str.lower)
            s1_site[d] = files

          with open("public/sitemap.json", "w", encoding="utf-8") as f:
            json.dump(s1_site, f, ensure_ascii=False, indent=2)
          print(f"sitemap.json: {len(s1_site)} folders")

          # ── Season 2 sitemap (sitemap-season2.json) ───────────────────────
          s2_root = os.path.join(public_dir, "SeasonTwoChat")
          s2_site = {}
          if os.path.isdir(s2_root):
            s2_folders = [
              d for d in os.listdir(s2_root)
              if os.path.isdir(os.path.join(s2_root, d)) and not d.startswith(".")
            ]
            s2_folders.sort(key=str.lower)
            for d in s2_folders:
              folder_path = os.path.join(s2_root, d)
              files = [f for f in os.listdir(folder_path) if f.lower().endswith(".html")]
              files.sort(key=str.lower)
              s2_site[d] = files

          with open("public/sitemap-season2.json", "w", encoding="utf-8") as f:
            json.dump(s2_site, f, ensure_ascii=False, indent=2)
          print(f"sitemap-season2.json: {len(s2_site)} folders")
          PY
          
      - name: Build React app
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4